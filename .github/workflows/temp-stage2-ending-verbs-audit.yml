name: TEMP Stage2 Ending Verbs Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-ending-verbs-audit.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Audit ending verbs
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re,collections,subprocess
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(len(rows))
          base=Path('sourcecards-targeted-review-7passes/ending-verbs-audit')
          base.mkdir(parents=True,exist_ok=True)
          # sentence-final eojeol stats
          ends=collections.Counter()
          byid=[]
          target_counts=collections.Counter()
          targets=['풉니다','풀이합니다','설명합니다','살핍니다','소개합니다','전합니다','다룹니다','짚습니다','비교합니다','보여 줍니다','나옵니다','이어집니다']
          for cid,pc,fn,text in rows:
              sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
              e=[]
              for s in sents:
                  m=re.search(r'([^\s]+?)[.!?]$',s)
                  if m:
                      eo=m.group(1); ends[eo]+=1; e.append(eo)
                  for t in targets:
                      target_counts[t]+=s.count(t)
              byid.append((cid,pc,fn,text,e))
          lines=['# 사료카드 2단계 여는말 종결동사 전수조사','',f'- 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: 498장 전체 여는말','', '## 주요 종결 표현 빈도']
          for t in targets: lines.append(f'- `{t}`: {target_counts[t]}회')
          lines += ['', '## 전체 문장 종결어 상위 40개']
          for k,v in ends.most_common(40): lines.append(f'- `{k}`: {v}회')
          lines += ['', '## 풉니다·풀이합니다 포함 장 전체']
          for i,(cid,pc,fn,text,e) in enumerate(byid,1):
              if '풉니다' in text or '풀이합니다' in text:
                  lines.append(f'- {i:03d}. `{cid}` | {pc} | `{fn}` | 종결={e} | {text}')
          # consecutive chapters where final sentence ends with 풉니다/풀이합니다
          lines += ['', '## 연속 반복 구간']
          run=[]
          for i,(cid,pc,fn,text,e) in enumerate(byid,1):
              hit=bool(e and e[-1] in ('풉니다','풀이합니다'))
              if hit: run.append((i,cid,pc,e[-1]))
              else:
                  if len(run)>=2: lines.append('- ' + ' → '.join(f'{i0:03d} {pc0}({end})' for i0,cid0,pc0,end in run))
                  run=[]
          if len(run)>=2: lines.append('- ' + ' → '.join(f'{i0:03d} {pc0}({end})' for i0,cid0,pc0,end in run))
          (base/'audit.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/ending-verbs-audit/audit.md
          git commit -m '사료카드 2단계 여는말 종결동사 전수조사'
          git push origin main
