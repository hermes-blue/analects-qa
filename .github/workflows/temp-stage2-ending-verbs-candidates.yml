name: TEMP Stage2 Ending Verbs Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-ending-verbs-candidates.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate candidates and build review files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/ending-verbs-audit')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              parts=ln.split('\t')
              if len(parts)!=4: raise SystemExit(f'bad spec row: {ln!r}')
              spec.append(parts)
          if len(spec)!=83: raise SystemExit(f'expected 83 candidates, got {len(spec)}')
          rows={}
          ordered=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  cid=ch['구절ID']
                  if cid in rows: raise SystemExit(f'duplicate id {cid}')
                  rows[cid]=(fn,ch)
                  ordered.append(ch['여는말'])
          if len(rows)!=498: raise SystemExit(f'expected 498 chapters, got {len(rows)}')
          before_all='\n'.join(ordered)
          before_count=len(re.findall(r'풀이합니다|풉니다',before_all))
          audits=[]
          revised_by_id={}
          md=['# 사료카드 2단계 `풉니다/풀이합니다` 남발 수정안 83건','',f'- 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 현재 `풉니다+풀이합니다`: **%d회**' % before_count,'- 수정 후보: **83장**','- 실제 낱말·문구 뜻풀이처럼 `풀이`가 정확한 기능을 하는 곳은 유지','- `설명합니다`로 기계 치환하지 않음 (`설명합니다`도 95회로 과다)','- **아직 본문 JSON 미반영**','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,oldfrag,newfrag,reason in spec:
              if cid not in rows: raise SystemExit(f'missing id {cid}')
              fn,ch=rows[cid]
              text=ch['여는말']
              n=text.count(oldfrag)
              if n!=1: raise SystemExit(f'{cid}: old fragment matches {n} times')
              revised=text.replace(oldfrag,newfrag,1)
              if revised==text: raise SystemExit(f'{cid}: no change')
              revised_by_id[cid]=revised
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':revised,'수정전구간':oldfrag,'수정후구간':newfrag,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f"| {ch['편장']} | {esc(oldfrag)} | {esc(newfrag)} | {reason} |")
          after_text=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  after_text.append(revised_by_id.get(ch['구절ID'], ch['여는말']))
          after_count=len(re.findall(r'풀이합니다|풉니다','\n'.join(after_text)))
          reduction=before_count-after_count
          md.insert(5, f'- 83건 모두 반영할 경우 `풉니다+풀이합니다`: **{before_count} → {after_count}회** (총 {reduction}회 감소)')
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          out={'작업':'사료카드 2단계 여는말 풀이동사 남발 전수검토','대상장수':498,'풀이동사현재횟수':before_count,'후보장수':83,'후보반영시횟수':after_count,'감소횟수':reduction,'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['풉니다·풀이합니다 자체를 금지하지 않음','실제 낱말·문구 뜻풀이는 유지','해석·판단·비교·원인 파악은 기능에 맞는 동사로 바꿈','설명합니다로 기계 치환하지 않음','이전 사용자 보류 후보는 재상정하지 않음','정보·해석·조건·부정·추정 강도 유지'],'후보':audits}
          (base/'candidate-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme=f'''# 사료카드 2단계 여는말 종결동사 전수조사\n\n- 대상: `sourcecards-style-polish/` 498장\n- 현재 `풉니다+풀이합니다`: {before_count}회\n- `설명합니다`: 95회\n- 수정 후보: 83장\n- 전부 반영 시 `풉니다+풀이합니다`: {after_count}회\n- 본문 반영: 0건 (승인 대기)\n\n과도한 `풀이합니다`는 여는말이 사료의 내용을 직접 안내하기보다 매번 “무엇을 풀이한다”는 메타 서술로 닫히면서 생긴 반복입니다. 실제 낱말·문구의 뜻풀이에는 유지하고, 해석·판단·비교·원인 파악은 `봅니다`, `읽습니다`, `해석합니다`, `살핍니다`, `짚습니다`, `구별합니다` 등 문장 기능에 맞는 서술로 바꾸는 후보만 제시합니다. `설명합니다`도 95회이므로 단순 대체어로 사용하지 않습니다.\n'''
          (base/'README.md').write_text(readme,encoding='utf-8')
          print('validated', len(audits), 'candidates; count', before_count, '->', after_count)
          PY
      - name: Commit review files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/ending-verbs-audit/approval-table.md sourcecards-targeted-review-7passes/ending-verbs-audit/candidate-audit.json sourcecards-targeted-review-7passes/ending-verbs-audit/README.md
          git commit -m '사료카드 2단계 풀이동사 남발 83건 수정안 정리'
          git push origin main
