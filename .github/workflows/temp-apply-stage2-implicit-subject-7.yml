name: TEMP Apply Stage2 Implicit Subject 7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-implicit-subject-7.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved edits
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          from pathlib import Path
          audit_path=Path('sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/audit.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8'))
          cs=audit['후보']
          if len(cs)!=7: raise SystemExit(f'expected 7, got {len(cs)}')
          staged={}; ids=set()
          for c in cs:
              p=Path(c['파일'])
              text=staged.get(p,p.read_text(encoding='utf-8'))
              old,new=c['수정전전체'],c['수정후전체']
              n=text.count(old)
              if n!=1: raise SystemExit(f"{c['구절ID']}: expected 1 exact match, got {n}")
              text=text.replace(old,new,1)
              json.loads(text)
              staged[p]=text; ids.add(c['구절ID'])
          if len(ids)!=7: raise SystemExit(f'expected 7 unique ids, got {len(ids)}')
          for p,text in staged.items(): p.write_text(text,encoding='utf-8')
          for c in cs:
              c['승인상태']='승인완료'; c['본문반영']=True
          audit['승인상태']='승인완료'; audit['본문반영수']=7; audit['반영완료']=True
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          if len(files)!=20: raise SystemExit(len(files))
          total=sum(len(json.loads(Path(fn).read_text(encoding='utf-8'))['장']) for fn in files)
          if total!=498: raise SystemExit(total)
          print('applied',len(cs),'total',total)
          PY
      - name: Commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/audit.json
          git commit -m '사료카드 2단계 주체 생략·무주어문 승인 7건 실제 반영'
          git push origin main
