name: TEMP Stage2 Jjip Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-jjip-candidates.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate all 25 and build approval files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/repeated-expression-audit/jjip-seumnida')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              p=ln.split('\t')
              if len(p)!=4: raise SystemExit(f'bad row: {ln!r}')
              spec.append(p)
          if len(spec)!=25: raise SystemExit(f'expected 25 got {len(spec)}')
          rows={}
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows[ch['구절ID']]=(fn,ch)
          if len(rows)!=498: raise SystemExit(len(rows))
          audits=[]
          md=['# 사료카드 2단계 `짚습니다` 25건 전수 수정안','',f'- 검토 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: `sourcecards-style-polish/` 여는말 498장','- 현재 `짚습니다`: **25회 / 25장**','- 목표: **25회 → 0회**','- 실제 본문 JSON 반영: **0건 (승인 대기)**','- 원칙: 일괄 동의어 치환 금지. 까닭·이유는 설명, 차이는 비교, 뜻은 해석/직접 서술, 배경·태도는 살펴보기/주목 등 문맥별로 분산.','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,old,new,reason in spec:
              if cid not in rows: raise SystemExit(f'missing id {cid}')
              fn,ch=rows[cid]; text=ch['여는말']
              n=text.count(old)
              if n!=1: raise SystemExit(f'{cid}: old match={n}\n{text}')
              revised=text.replace(old,new,1)
              if '짚습니다' in revised: raise SystemExit(f'{cid}: 짚습니다 remains after revision')
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':revised,'수정전구간':old,'수정후구간':new,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f'| {ch["편장"]} | {esc(old)} | {esc(new)} | {esc(reason)} |')
          # Ensure these are all current occurrences in source body
          total=sum(ch['여는말'].count('짚습니다') for fn in glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json') for ch in json.loads(Path(fn).read_text(encoding='utf-8'))['장'])
          if total!=25: raise SystemExit(f'body total changed: {total}')
          out={'작업':'사료카드 2단계 짚습니다 전수 제거 후보','대상장수':498,'현재출현수':25,'후보수':25,'목표출현수':0,'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['25회 전부 수정 대상으로 지정','일괄 동의어 치환 금지','까닭·이유→설명/살펴보기','차이→비교','뜻→해석 또는 직접 판단','배경·태도→살펴보기/주목','정보·해석·조건·부정·추정 강도 유지'],'후보':audits}
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (base/'audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (base/'README.md').write_text('# `짚습니다` 전수 수정\n\n- 현재 25회 / 25장\n- 후보 25건 모두 현재 JSON과 정확히 일치 확인\n- 승인 반영 시 0회\n- 본문 반영은 아직 하지 않음\n',encoding='utf-8')
          print('validated 25; current total',total)
          PY
      - name: Commit review files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/repeated-expression-audit/jjip-seumnida/approval-table.md sourcecards-targeted-review-7passes/repeated-expression-audit/jjip-seumnida/audit.json sourcecards-targeted-review-7passes/repeated-expression-audit/jjip-seumnida/README.md
          git commit -m '사료카드 2단계 짚습니다 25건 전수 수정안 정리'
          git push origin main
