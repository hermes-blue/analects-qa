name: TEMP Apply Stage2 Cycle2 Pass2
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-stage2-cycle2-pass2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved cycle2 pass2 edit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit_path=Path('sourcecards-targeted-review-7passes/cycle2-pass2-abstract-subject/audit.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8'))
          candidates=audit['후보']
          if len(candidates)!=1:
              raise SystemExit(f'candidate count mismatch: {len(candidates)}')
          c=candidates[0]
          p=Path(c['파일'])
          text=p.read_text(encoding='utf-8')
          old=c['수정전전체']; new=c['수정후전체']
          count=text.count(old)
          if count!=1:
              raise SystemExit(f'{c["구절ID"]}: expected 1 match in {p}, got {count}')
          text=text.replace(old,new,1)
          json.loads(text)
          p.write_text(text,encoding='utf-8')
          c['승인상태']='승인완료'; c['본문반영']=True
          audit['승인상태']='승인완료'; audit['본문반영수']=1; audit['반영완료']=True
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          files=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          if len(files)!=20: raise SystemExit(f'expected 20 JSON files, got {len(files)}')
          total=0
          for fn in files:
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              total += len(data['장'])
          if total!=498: raise SystemExit(f'expected 498 chapters, got {total}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/18-mija.json sourcecards-targeted-review-7passes/cycle2-pass2-abstract-subject/audit.json
          git commit -m '사료카드 2단계 2회전 2바퀴 승인 1건 실제 반영'
          git push origin main
