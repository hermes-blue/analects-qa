name: TEMP Apply Stage2 Pass1 Approved
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-stage2-pass1-approved.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path('sourcecards-targeted-review-7passes/pass1-subject-predicate/audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          candidates = audit['후보']
          if len(candidates) != 16:
              raise SystemExit(f'candidate count mismatch: {len(candidates)}')

          staged = {}
          for c in candidates:
              p = Path(c['파일'])
              text = staged.get(p)
              if text is None:
                  text = p.read_text(encoding='utf-8')
              old = c['수정전']
              new = c['수정후제안']
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{c["구절ID"]}: expected 1 match in {p}, got {count}')
              text = text.replace(old, new, 1)
              json.loads(text)
              staged[p] = text

          for p, text in staged.items():
              p.write_text(text, encoding='utf-8')

          for c in candidates:
              c['승인상태'] = '승인완료'
              c['본문반영'] = True
          audit['승인상태'] = '승인완료'
          audit['본문반영수'] = 16
          audit['반영완료'] = True
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print(f'validated and applied 16 edits across {len(staged)} JSON files')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only -- sourcecards-style-polish/ | wc -l)
          test "$changed" -eq 11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/pass1-subject-predicate/audit.json
          git commit -m '사료카드 2단계 1바퀴 승인 16건 실제 반영'
          git push origin main
