name: TEMP Stage2 Question Openings Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-question-openings-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build question-opening audit
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re, subprocess, collections
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(len(rows))
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass10-question-openings')
          base.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          hits=[]; total_q=0; first_q=0
          forms=collections.Counter()
          for i,(cid,pc,fn,text) in enumerate(rows,1):
              sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
              qs=[s for s in sents if s.endswith('?')]
              if qs:
                  total_q += len(qs)
                  fq=bool(sents and sents[0].endswith('?'))
                  if fq: first_q+=1
                  for q in qs:
                      for pat,name in [(r'왜[^?]*\?','왜 ~?'),(r'어떻게[^?]*\?','어떻게 ~?'),(r'무엇[^?]*\?','무엇 ~?'),(r'누구[^?]*\?','누구 ~?'),(r'어떤[^?]*\?','어떤 ~?'),(r'일까요\?','~일까요?'),(r'할까요\?','~할까요?'),(r'될까요\?','~될까요?'),(r'했을까요\?','~했을까요?')]:
                          if re.search(pat,q): forms[name]+=1
                  hits.append((i,cid,pc,fn,fq,text))
          lines=['# 사료카드 2단계 상투적 질문형 도입 전수조사','',f'- 기준 커밋: `{head}`','- 대상: 498장 전체 여는말',f'- 물음표 포함 장수: {len(hits)}',f'- 질문 문장 총수: {total_q}',f'- 첫 문장이 질문인 장수: {first_q}','', '## 질문형 표현 빈도']
          for k,v in forms.most_common(): lines.append(f'- `{k}`: {v}회')
          lines += ['', '## 질문 포함 장 전체']
          for i,cid,pc,fn,fq,text in hits:
              lines.append(f'- {i:03d}. `{cid}` | {pc} | 첫문장질문={fq} | `{fn}` | {text}')
          (base/'question-scan.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          full=['# 질문형 도입 전수검토 현재본','',f'- 기준 커밋: `{head}`','- 대상: 498장 전체 여는말','']
          for i,(cid,pc,fn,text) in enumerate(rows,1): full.append(f'{i:03d}. `{cid}` | {pc} | {text}')
          (base/'all-openings-current.md').write_text('\n'.join(full)+'\n',encoding='utf-8')
          print('question chapters',len(hits),'total questions',total_q,'first-question',first_q)
          PY
      - name: Commit audit inputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass10-question-openings/
          git commit -m '사료카드 2단계 질문형 도입 전수조사 입력 추가'
          git push origin main
