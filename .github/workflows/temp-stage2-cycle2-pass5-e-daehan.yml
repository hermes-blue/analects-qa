name: TEMP Stage2 Cycle2 Pass5 E-Daehan Scan
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-stage2-cycle2-pass5-e-daehan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Scan nominal relation phrases
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(f'expected 498 openings, got {len(rows)}')
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass5-e-daehan')
          base.mkdir(parents=True,exist_ok=True)
          pats=[r'에 대한',r'에 관한',r'와 관련된',r'과 관련된',r'와 관련한',r'과 관련한',r'에 관련된',r'에 관련한']
          rx=re.compile('|'.join(pats))
          hits=[]
          for cid,pc,fn,text in rows:
              ms=sorted(set(m.group(0) for m in rx.finditer(text)))
              if ms: hits.append((cid,pc,fn,', '.join(ms),text))
          lines=['# 2회전 5바퀴 명사 연결형 직역투 보조 스캔','',f'- 표지어 적중 장수: {len(hits)}','- 표적: ~에 대한 / ~에 관한 / ~와 관련된·관련한. 표지 자체는 수정 사유가 아님. 동사로 바로 쓰는 편이 분명히 자연스러운 경우만 후보화.','']
          for cid,pc,fn,ms,text in hits:
              lines.append(f'- `{cid}` | {pc} | `{fn}` | 표지: {ms} | {text}')
          (base/'marker-scan.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit scan
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass5-e-daehan/marker-scan.md
          git commit -m '사료카드 2단계 2회전 5바퀴 명사연결형 표지 추가'
          git push origin main
