name: TEMP Stage2 Cycle2 Pass2 Scan
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-stage2-cycle2-pass2-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build snapshot and abstract-subject scan
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re,subprocess
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(f'expected 498 openings, got {len(rows)}')
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass2-abstract-subject')
          base.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          lines=['# 사료카드 2단계 2회전 2바퀴 현재 여는말 498장','',f'- 기준 커밋: `{head}`','- 표적: 부자연스러운 추상명사 주어·행위 주체 흐림','']
          for i,(cid,pc,fn,text) in enumerate(rows,1): lines.append(f'{i:03d}. `{cid}` | {pc} | {text}')
          (base/'all-openings-current.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          nouns=['답','답변','설명','기록','말','말씀','주석','문답','논설','글','대목','자료','평가','해석','풀이','사례','이야기','비유','발언','질문','구절','문장','전기','기록들','설명들','풀이들','주석들']
          verbs=['묻','되묻','따지','살피','판단','걱정','주목','비판','의문','경계','강조','설명','풀이','말하','전하','보여','드러내','찾','비교','구별','논하','짚','평가','소개','다루','검토','반박','해석']
          n='(?:'+ '|'.join(map(re.escape,nouns)) +')'
          v='(?:'+ '|'.join(map(re.escape,verbs)) +')'
          rx=re.compile(n+r'(?:은|는|이|가|에서는|에서)[^.!?]{0,45}'+v)
          hits=[]
          for cid,pc,fn,text in rows:
              if rx.search(text): hits.append((cid,pc,fn,text))
          ml=['# 2회전 2바퀴 추상명사 주어 표지 재검토','',f'- 적중 장수: {len(hits)}','- 표지 적중 자체는 수정 사유가 아님. 자연스러운 문서 주어는 유지.','']
          for cid,pc,fn,text in hits: ml.append(f'- `{cid}` | {pc} | `{fn}` | {text}')
          (base/'marker-scan.md').write_text('\n'.join(ml)+'\n',encoding='utf-8')
          PY
      - name: Commit review inputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass2-abstract-subject/
          git commit -m '사료카드 2단계 2회전 2바퀴 현재본·추상주어 표지 추가'
          git push origin main
