name: TEMP Stage2 Implicit Subject Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-implicit-subject-audit.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build implicit-subject audit
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re, subprocess
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(len(rows))
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject')
          base.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          target_endings=('설명합니다','살핍니다','소개합니다','다룹니다','나옵니다','전합니다','짚습니다','풀이합니다','풉니다','비교합니다','말합니다','이야기합니다','따집니다','봅니다','해석합니다','읽습니다','덧붙입니다','이어집니다','보여 줍니다','보여줍니다','알아봅니다','살펴봅니다')
          suspects=[]
          full=['# 사료카드 2단계 주체 생략·무주어문 전수검토 현재본','',f'- 기준 커밋: `{head}`','- 대상: 498장 전체 여는말','- 기준: 한국어의 자연스러운 주어 생략은 유지하고, 해설 행위의 주체가 흐려져 문장이 뜨는 경우만 후보화','']
          for i,(cid,pc,fn,text) in enumerate(rows,1):
              full.append(f'{i:03d}. `{cid}` | {pc} | {text}')
              sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
              for j,s in enumerate(sents):
                  if not s.endswith(target_endings):
                      continue
                  # crude explicit-subject/topic detector; purposely broad, only for review narrowing
                  prefix=s[:60]
                  explicit=bool(re.search(r'(^|\s|[『“‘])[^,.!?]{0,25}(은|는|이|가|에서는|에는|께서는)\s',prefix))
                  starts_meta=bool(re.match(r'^(이어|이어서|뒤에는|뒤에서|마지막에는|먼저|또|함께|이후|그 뒤|뒤이어|여기서는|여기 실린|이때|이렇게|이를|그렇게)\b',s))
                  if (not explicit) or starts_meta:
                      suspects.append((i,cid,pc,fn,j+1,s,explicit,starts_meta,text))
          (base/'all-openings-current.md').write_text('\n'.join(full)+'\n',encoding='utf-8')
          out=['# 주체 생략·무주어문 보조 스캔','',f'- 기준 커밋: `{head}`',f'- 보조 휴리스틱 적중 문장: {len(suspects)}','- 이 목록은 후보가 아니라 정독 보조용입니다. 한국어의 자연스러운 주어 생략을 대량으로 포함합니다.','']
          for i,cid,pc,fn,j,s,exp,meta,text in suspects:
              out.append(f'- {i:03d}. `{cid}` | {pc} | 문장{j} | explicit={exp} meta_start={meta} | {s} || 전체: {text}')
          (base/'marker-scan.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('rows',len(rows),'suspect-sentences',len(suspects))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/
          git commit -m '사료카드 2단계 주체 생략·무주어문 전수검토 입력 추가'
          git push origin main
