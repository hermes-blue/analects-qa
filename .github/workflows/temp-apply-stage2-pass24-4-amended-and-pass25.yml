name: TEMP Apply Stage2 Pass24 4 Amended And Pass25
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-pass24-4-amended-and-pass25.yml']
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved 4 with amended wording and scan same type again
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re, subprocess
          from pathlib import Path

          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          assert len(files)==20, len(files)
          data_by_file={}; by_pj={}; total=0
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              data_by_file[fn]=d
              for ch in d['장']:
                  total+=1; by_pj[ch['편장']]=(fn,ch)
          assert total==498, total

          changes={
            '헌문 8':(
              '‘수고롭게 한다’는 말을 보살핀다는 뜻으로 볼지, 실제로 힘들게 한다는 뜻으로 볼지 견해가 갈립니다. 정약용은 이 말을 가르치고 꾸짖는다는 말과 함께 살피며 사랑과 충심의 뜻을 풉니다.',
              '이 말에는 두 가지 풀이가 있습니다. 하나는 보살핀다는 뜻이고, 다른 하나는 실제로 힘들게 한다는 뜻입니다. 정약용은 이 말을 가르치고 꾸짖는다는 말과 연결합니다. 두 표현 모두 사랑과 충심에서 나온 말로 해석합니다.'),
            '위령공 24':(
              '사람을 칭찬하기 전에 살폈다는 뜻인지, 칭찬한 뒤에 시험했다는 뜻인지 풀이가 갈립니다. 정약용은 두 주석을 비교해 자신이 따를 해석을 밝힙니다.',
              '풀이가 두 갈래로 갈립니다. 하나는 사람을 칭찬하기 전에 살폈다는 뜻이고, 다른 하나는 칭찬한 뒤에 시험했다는 뜻입니다. 정약용은 두 주석을 비교해 자신이 따를 해석을 밝힙니다.'),
            '자장 13':(
              '첸무는 일을 하면서 배우는 경우와 먼저 배운 뒤 일하는 경우를 나누어 자하의 말을 풀이합니다. 두 경우가 각각 어떤 도움이 되는지 말하고, ‘여력’이 무슨 뜻인지도 풀이합니다.',
              '첸무는 일을 하면서 배우는 경우와 먼저 배운 뒤 일하는 경우를 나누어 자하의 말을 풀이합니다. 먼저 두 경우가 각각 어떤 도움이 되는지 설명합니다. 이어 ‘여력’의 뜻도 풀이합니다.'),
            '이인 2':(
              '조선의 경연에서는 자로와 안회, 공자님의 경지를 비교합니다. 인을 구하는 사람과 편안히 실천하는 사람은 어떻게 다를까요? 세 사람에게 사사로운 마음이 남아 있는지, 또 어떻게 배우는지를 비교합니다.',
              '조선의 경연에서는 자로와 안회, 공자님의 경지를 비교합니다. 인을 구하는 사람과 편안히 실천하는 사람은 어떻게 다를까요? 세 사람의 사사로운 마음과 배우는 태도를 비교합니다.')
          }
          changed=set(); audit=[]
          for pj,(old,new) in changes.items():
              fn,ch=by_pj[pj]
              cur=ch['여는말']
              if cur==new:
                  audit.append({'편장':pj,'파일':fn,'상태':'이미반영','수정전':old,'수정후':new}); continue
              if cur!=old:
                  raise SystemExit(f'{pj} mismatch\nCURRENT={cur}\nOLD={old}')
              ch['여는말']=new; changed.add(fn)
              audit.append({'편장':pj,'파일':fn,'상태':'이번반영','수정전':old,'수정후':new})
          for fn in changed:
              Path(fn).write_text(json.dumps(data_by_file[fn],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          base=Path('sourcecards-targeted-review-7passes/cycle2-pass24-residual-nominal-adnominal')
          p=base/'approval-table-4.md'
          txt=p.read_text(encoding='utf-8')
          txt=txt.replace('정약용은 이 말을 가르치고 꾸짖는다는 말과 함께 살피며 사랑과 충심의 뜻을 풉니다. | `~다는 뜻으로 볼지`가 두 번 겹쳐 첫 문장이 무거움 |',
                          '정약용은 이 말을 가르치고 꾸짖는다는 말과 연결합니다. 두 표현 모두 사랑과 충심에서 나온 말로 해석합니다. | `~다는 뜻으로 볼지`가 두 번 겹치고 `살피며 ~ 풉니다`도 해설 동사가 겹침 |')
          txt=txt.replace('**승인 대기 / 본문 JSON 미반영**','**승인완료 / 본문 JSON 4건 반영완료**',1)
          p.write_text(txt,encoding='utf-8')
          (base/'application-audit-4.json').write_text(json.dumps({'작업':'관형절 9차 4건 승인반영','본문반영수':4,'비고':'헌문 8은 살피며 풀이합니다 계열 해설동사 겹침을 제거한 문안으로 반영','항목':audit},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Pass25: same family, narrower residual scan.
          hits=[]
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in d['장']:
                  text=ch['여는말']
                  for i,s in enumerate([x.strip() for x in re.split(r'(?<=[.!?])\s+',text) if x.strip()],1):
                      L=len(s); score=0; reasons=[]
                      rels=len(re.findall(r'(?:다는|라는|하는|한|했던|하던|되는|된|던)',s))
                      if rels>=3: score+=2; reasons.append(f'관형표지{rels}')
                      pair_shell=bool(re.search(r'(?:다는|라는|하는|한).{2,26}(?:뜻|말|일|것|경우).{0,16}(?:과|와|,|이고|이며).{0,16}(?:다는|라는|하는|한).{2,26}(?:뜻|말|일|것|경우)',s))
                      if pair_shell: score+=4; reasons.append('관형명사구병렬')
                      qpair=bool(re.search(r'(?:는지|인지|었는지|였는지|할지|을지).{2,44}(?:는지|인지|었는지|였는지|할지|을지)',s))
                      if qpair: score+=4; reasons.append('간접의문절중첩')
                      nominal_pair=bool(re.search(r'(?:것과|일과|말과|뜻과).{3,40}(?:것을|일을|말을|뜻을|것이|일이|말이|뜻이)',s))
                      if nominal_pair: score+=3; reasons.append('명사절병렬')
                      if re.search(r'(?:살피며|살펴|따지며|비교하며).{0,20}(?:풉니다|풀이합니다|설명합니다)',s):
                          score+=2; reasons.append('해설동사겹침')
                      if 38<=L<=70: score+=1
                      if score>=5:
                          hits.append({'구절ID':ch['구절ID'],'편장':ch['편장'],'파일':fn,'문장번호':i,'문장':s,'전체여는말':text,'길이':L,'점수':score,'표지':reasons})
          hits.sort(key=lambda x:(-x['점수'],-x['길이']))
          out=Path('sourcecards-targeted-review-7passes/cycle2-pass25-residual-adnominal-final')
          out.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          md=['# 관형절 10차 — 잔존 관형절·명사절 최종 재스캔','',f'- 기준 커밋: `{head}`','- 대상: 20파일 / 498장',f'- 휴리스틱 적중: **{len(hits)}문장**','- 같은 유형을 더 좁혀 재검토하기 위한 입력. 자동 수정 대상 아님.','']
          for n,h in enumerate(hits,1):
              md.append(f"{n}. `{h['구절ID']}` | {h['편장']} | 점수={h['점수']} 길이={h['길이']} 표지={','.join(h['표지'])} | {h['문장']} | 전체: {h['전체여는말']}")
          (out/'heuristic-hits.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (out/'heuristic-hits.json').write_text(json.dumps({'기준커밋':head,'대상장수':498,'적중문장수':len(hits),'항목':hits},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          for n,a in enumerate(range(0,len(hits),25),1):
              part=hits[a:a+25]; lines=[f'# 관형절 10차 후보 {a+1}~{a+len(part)}','']
              for j,h in enumerate(part,a+1):
                  lines.append(f"{j}. {h['구절ID']} | {h['편장']} | 점수={h['점수']} | 문장: {h['문장']} | 전체: {h['전체여는말']}")
              (out/f'review-chunk-{n}.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('applied4 pass25_hits',len(hits))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          fs=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          assert len(fs)==20
          assert sum(len(json.loads(Path(f).read_text(encoding='utf-8'))['장']) for f in fs)==498
          print('validated 20 JSON / 498 chapters')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/cycle2-pass24-residual-nominal-adnominal/ sourcecards-targeted-review-7passes/cycle2-pass25-residual-adnominal-final/
          git commit -m '사료카드 2단계 관형절 9차 4건 반영 및 10차 재스캔'
          git pull --rebase origin main
          git push origin main
