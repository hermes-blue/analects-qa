name: TEMP Stage2 Connective Pronoun Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-connective-pronoun-candidates.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and build review files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass9-connectives-pronouns')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              p=ln.split('\t')
              if len(p)!=4: raise SystemExit(f'bad row {ln!r}')
              spec.append(p)
          if len(spec)!=8: raise SystemExit(f'expected 8 got {len(spec)}')
          rows={}
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows[ch['구절ID']]=(fn,ch)
          if len(rows)!=498: raise SystemExit(len(rows))
          audits=[]
          md=['# 사료카드 2단계 연결부사·지시어 반복 수정안 8건','',f'- 검토 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: 498장 전체 여는말','- 보조 표지 적중: 216장','- 실제 본문 JSON 반영: **0건 (승인 대기)**','- 기준: 연결부사·지시어 자체를 금지하지 않고, 같은 주체 반복과 조립식 연결이 겹치는 경우만 수정 후보화','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,old,new,reason in spec:
              fn,ch=rows[cid]; text=ch['여는말']
              if text.count(old)!=1: raise SystemExit(f'{cid} old match {text.count(old)}')
              revised=text.replace(old,new,1)
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':revised,'수정전구간':old,'수정후구간':new,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f'| {ch["편장"]} | {esc(old)} | {esc(new)} | {reason} |')
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          out={'작업':'사료카드 2단계 연결부사·지시어 반복 전수검토','대상장수':498,'표지적중장수':216,'후보수':8,'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['498장 전체 정독','연결부사·지시어 자체를 금지하지 않음','같은 주체 반복과 조립식 연결이 겹칠 때만 수정','자연스러운 함께·이를·이어는 유지','정보·해석·조건·부정·추정 강도 유지'],'후보':audits}
          (base/'audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme='''# 연결부사·지시어 반복 전수검토\n\n- 대상: 사료카드 2단계 여는말 498장 전체\n- 보조 표지 적중: 216장\n- 최종 후보: 8장\n- 본문 반영: 0건 (승인 대기)\n\n`함께`, `이를`, `이어` 자체는 대부분 자연스러워 유지했습니다. 같은 주체를 연속해서 다시 쓰면서 `이어`까지 붙이거나, `이 주석은 … 이를 …`처럼 지시어가 연속되어 문장이 조립식으로 보이는 경우만 후보로 남겼습니다.\n'''
          (base/'README.md').write_text(readme,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass9-connectives-pronouns/approval-table.md sourcecards-targeted-review-7passes/cycle2-pass9-connectives-pronouns/audit.json sourcecards-targeted-review-7passes/cycle2-pass9-connectives-pronouns/README.md
          git commit -m '사료카드 2단계 연결부사·지시어 반복 8건 수정안 정리'
          git push origin main
