name: TEMP Stage2 Cycle2 Pass1 Marker Scan
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-stage2-cycle2-pass1-marker-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Scan AI/translationese markers
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re
          from pathlib import Path
          pats=[
            r'글입니다',r'대목입니다',r'주석입니다',r'기록입니다',r'이야기입니다',r'자료입니다',r'문답입니다',r'설명입니다',r'풀이입니다',
            r'을 통해',r'를 통해',r'바탕으로',r'관점에서',r'과정에서',r'초점을 맞',r'관련지어',
            r'답변은',r'설명은',r'기록은',r'말은',r'주석은',r'논설은',r'문답은',
            r'~의'
          ]
          rx=re.compile('|'.join(pats))
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  text=ch['여는말']
                  ms=sorted(set(m.group(0) for m in rx.finditer(text)))
                  if ms:
                      rows.append((ch['구절ID'],ch['편장'],fn,', '.join(ms),text))
          out=Path('sourcecards-targeted-review-7passes/cycle2-pass1-ai-translationese/marker-scan.md')
          lines=['# 2회전 1바퀴 AI말투·직역투 표지어 재검토','',f'- 적중 장수: {len(rows)}','- 표지어 적중 자체는 수정 사유가 아님. 문맥상 사람이 쓴 문장보다 메타적·우회적일 때만 후보화.','']
          for cid,pc,fn,ms,text in rows:
              lines.append(f'- `{cid}` | {pc} | `{fn}` | 표지: {ms} | {text}')
          out.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Commit scan
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass1-ai-translationese/marker-scan.md
          git commit -m '사료카드 2단계 2회전 1바퀴 AI말투 표지어 목록 추가'
          git push origin main
