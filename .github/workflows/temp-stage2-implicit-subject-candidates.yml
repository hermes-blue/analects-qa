name: TEMP Stage2 Implicit Subject Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-implicit-subject-candidates.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate candidates and build review files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              p=ln.split('\t')
              if len(p)!=4: raise SystemExit(f'bad row: {ln!r}')
              spec.append(p)
          if len(spec)!=7: raise SystemExit(f'expected 7 got {len(spec)}')
          rows={}
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows[ch['구절ID']]=(fn,ch)
          if len(rows)!=498: raise SystemExit(len(rows))
          audits=[]
          md=['# 사료카드 2단계 주체 생략·무주어문 수정안 7건','',f'- 검토 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: 498장 전체 여는말','- 보조 휴리스틱 적중 문장: 62','- 실제 본문 JSON 반영: **0건 (승인 대기)**','- 기준: 자연스러운 한국어 주어 생략은 유지하고, 해설 주체가 흐려지거나 앞 문장의 사람 주체와 잘못 이어질 수 있는 경우만 후보화','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,old,new,reason in spec:
              if cid not in rows: raise SystemExit(f'missing {cid}')
              fn,ch=rows[cid]; text=ch['여는말']
              if text.count(old)!=1: raise SystemExit(f'{cid}: old match={text.count(old)}')
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':text.replace(old,new,1),'수정전구간':old,'수정후구간':new,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f'| {ch["편장"]} | {esc(old)} | {esc(new)} | {reason} |')
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          out={'작업':'사료카드 2단계 주체 생략·무주어문 전수검토','대상장수':498,'보조휴리스틱적중문장':62,'후보수':7,'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['498장 전체 정독','한국어의 자연스러운 주어 생략은 유지','해설 주체가 흐려지는 경우만 명시','앞 문장 주체와 다음 문장 해설 주체가 혼동될 수 있는 경우 우선','정보·해석·조건·부정·추정 강도 유지'],'후보':audits}
          (base/'audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (base/'README.md').write_text('# 주체 생략·무주어문 전수검토\n\n- 대상: 498장 전체\n- 보조 휴리스틱 적중 문장: 62\n- 최종 후보: 7장\n- 본문 반영: 0건 (승인 대기)\n\n한국어에서 자연스러운 주어 생략은 대부분 유지했습니다. 해설 주체가 아예 없거나 앞 문장의 인물 주체와 잘못 이어질 수 있는 경우만 후보로 남겼습니다.\n',encoding='utf-8')
          PY
      - name: Commit review files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/approval-table.md sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/audit.json sourcecards-targeted-review-7passes/cycle2-pass11-implicit-subject/README.md
          git commit -m '사료카드 2단계 주체 생략·무주어문 7건 수정안 정리'
          git push origin main
