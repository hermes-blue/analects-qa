name: TEMP Stage2 Meta Intro Refine
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-meta-intro-refine.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine meta-intro candidates
        shell: bash
        run: |
          python - <<'PY'
          import json,re,glob
          from pathlib import Path
          rows=[]
          strong_patterns=[
            r'^(?:이|그|앞의|뒤의)?\s*(?:글|기록|주석|논설|전기|자료|문답|이야기)(?:은|는|이|가).*?(?:다룹니다|소개합니다|설명합니다|풀이합니다|전합니다|정리합니다|보여 줍니다)',
            r'^(?:여기서는|뒤에는|앞에는|마지막에는|이어|그다음에는).*?(?:나옵니다|이어집니다|소개합니다|다룹니다|설명합니다|전합니다)',
            r'.*?(?:함께|차례로)\s*(?:실었습니다|모았습니다)',
            r'.*?(?:이야기|기록|대목|설명|문답|사례)(?:가|이)\s*(?:나옵니다|이어집니다)',
            r'.*?를\s*(?:다룹니다|소개합니다)$',
          ]
          rs=[re.compile(x) for x in strong_patterns]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in d['장']:
                  text=ch['여는말']
                  sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
                  for i,s in enumerate(sents,1):
                      if any(r.search(s) for r in rs):
                          rows.append({'구절ID':ch['구절ID'],'편장':ch['편장'],'파일':fn,'문장번호':i,'문장':s,'전체여는말':text})
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass15-meta-intro')
          base.mkdir(parents=True,exist_ok=True)
          md=['# 자료소개형 메타문장 2차 압축 후보','',f'- 498장 전체에서 강한 구조 표지 적중: **{len(rows)}문장**','- 자동 수정 대상 아님. 사람 눈으로 최종 선별.','']
          for i,r in enumerate(rows,1): md.append(f"{i}. `{r['구절ID']}` | {r['편장']} | {r['문장']} | 전체: {r['전체여는말']}")
          (base/'refined-candidates.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (base/'refined-candidates.json').write_text(json.dumps({'대상장수':498,'적중문장수':len(rows),'항목':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # split into chunks for manual review
          chunk=30
          for n,a in enumerate(range(0,len(rows),chunk),1):
              part=rows[a:a+chunk]
              out=[f'# 메타문장 후보 {a+1}~{a+len(part)}','']
              for j,r in enumerate(part,a+1): out.append(f"{j}. {r['구절ID']} | {r['편장']} | 문장: {r['문장']} | 전체: {r['전체여는말']}")
              (base/f'refined-{n}.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('refined',len(rows))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass15-meta-intro/
          git commit -m '사료카드 2단계 자료소개형 메타문장 후보 압축'
          git push origin main
