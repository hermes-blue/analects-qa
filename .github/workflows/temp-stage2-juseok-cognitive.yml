name: TEMP Stage2 Juseok Cognitive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-juseok-cognitive.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build cognitive subset
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject')
          d=json.loads((base/'all-matches.json').read_text(encoding='utf-8'))
          keys=['살피','따지','주목','찾','봅니다','읽습니다','검토','추정','판단','평가']
          rows=[]
          for r in d['항목']:
              if not r['문서주어']: continue
              if any(k in r['문장'] for k in keys): rows.append(r)
          md=['# `주석` 문서주어 중 인지행위형 우선검토군','',f'- 문서주어 전체: 76문장',f'- 인지행위형 우선검토군: **{len(rows)}문장**','- 기준: 살피다·따지다·주목하다·찾다·보다·읽다·검토하다·추정하다·판단하다·평가하다 계열','- 이 목록도 자동 수정 대상은 아님. 실제 수정안은 문맥을 읽고 선별.','']
          for i,r in enumerate(rows,1): md.append(f"{i}. `{r['구절ID']}` | {r['편장']} | {r['문장']}")
          (base/'cognitive-subjects.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('cognitive',len(rows))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject/cognitive-subjects.md
          git commit -m '사료카드 2단계 주석 인지행위 주어 우선검토군 정리'
          git push origin main
