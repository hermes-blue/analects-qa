name: TEMP Stage2 Cycle2 Pass6 Point Fact Scan
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-cycle2-pass6-point-fact.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build snapshot and scan
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re,subprocess
          from pathlib import Path
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if len(rows)!=498: raise SystemExit(f'expected 498 openings, got {len(rows)}')
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass6-point-fact')
          base.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          lines=['# 사료카드 2단계 2회전 6바퀴 현재 여는말 498장','',f'- 기준 커밋: `{head}`','- 표적: ~라는 점 / ~다는 점 / ~라는 사실 / ~다는 사실 식 명사화 우회. 자연스러운 강조는 유지.','']
          for i,(cid,pc,fn,text) in enumerate(rows,1): lines.append(f'{i:03d}. `{cid}` | {pc} | {text}')
          (base/'all-openings-current.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          pats=[r'라는 점',r'다는 점',r'였다는 점',r'이라는 점',r'라는 사실',r'다는 사실',r'였다는 사실',r'이라는 사실',r'점에 주목',r'점에서',r'점을 들어',r'점을 짚']
          rx=re.compile('|'.join(pats))
          hits=[]
          for cid,pc,fn,text in rows:
              ms=sorted(set(m.group(0) for m in rx.finditer(text)))
              if ms: hits.append((cid,pc,fn,', '.join(ms),text))
          ml=['# 2회전 6바퀴 점·사실 명사화 보조 스캔','',f'- 표지어 적중 장수: {len(hits)}','- 표지 자체는 수정 사유가 아님. 문장을 한 번 감싸 돌아가게 만드는 경우만 후보화.','']
          for cid,pc,fn,ms,text in hits: ml.append(f'- `{cid}` | {pc} | `{fn}` | 표지: {ms} | {text}')
          (base/'marker-scan.md').write_text('\n'.join(ml)+'\n',encoding='utf-8')
          PY
      - name: Commit review inputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass6-point-fact/
          git commit -m '사료카드 2단계 2회전 6바퀴 현재본·점사실 표지 추가'
          git push origin main
