name: TEMP Apply Stage2 Ending Verbs 83
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-ending-verbs-83.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved edits
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re
          from pathlib import Path
          audit_path=Path('sourcecards-targeted-review-7passes/ending-verbs-audit/candidate-audit.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8'))
          cs=audit['후보']
          if len(cs)!=83: raise SystemExit(f'expected 83 candidates, got {len(cs)}')
          staged={}
          touched_ids=set()
          for c in cs:
              p=Path(c['파일'])
              text=staged.get(p,p.read_text(encoding='utf-8'))
              old,new=c['수정전전체'],c['수정후전체']
              n=text.count(old)
              if n!=1: raise SystemExit(f"{c['구절ID']}: expected 1 exact match, got {n}")
              text=text.replace(old,new,1)
              json.loads(text)
              staged[p]=text
              touched_ids.add(c['구절ID'])
          if len(touched_ids)!=83: raise SystemExit(f'expected 83 unique ids, got {len(touched_ids)}')
          for p,text in staged.items(): p.write_text(text,encoding='utf-8')
          for c in cs:
              c['승인상태']='승인완료'; c['본문반영']=True
          audit['승인상태']='승인완료'; audit['본문반영수']=83; audit['반영완료']=True
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # validate all 20 JSON files / 498 chapters
          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          if len(files)!=20: raise SystemExit(f'expected 20 files, got {len(files)}')
          total=0; texts=[]
          for fn in files:
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              total+=len(data['장'])
              texts.extend(ch['여는말'] for ch in data['장'])
          if total!=498: raise SystemExit(f'expected 498 chapters, got {total}')
          remaining=len(re.findall(r'풀이합니다|풉니다','\n'.join(texts)))
          if remaining!=45: raise SystemExit(f'expected 45 remaining 풀이 verbs, got {remaining}')
          print(f'applied 83 edits; remaining 풀이 verbs={remaining}; touched files={len(staged)}')
          PY
      - name: Commit
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/ending-verbs-audit/candidate-audit.json
          git commit -m '사료카드 2단계 풀이동사 남발 승인 83건 실제 반영'
          git push origin main
