name: TEMP Apply Stage2 Abstract10 And Scan Meta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-abstract10-and-scan-meta.yml']
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved 10 and scan meta-intro verbs
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, re, subprocess
          from pathlib import Path
          edits={
            'ly-04-12':(
              '이익을 좇으면 원망이 많아진다는 말에서, 원망하는 사람은 누구일까요. 첸무는 남이 나를 원망한다는 옛 풀이와 달리 내 마음에 쌓이는 원망에 주목합니다.',
              '이익을 좇으면 원망이 많아진다는 말에서, 원망하는 사람은 누구일까요. 첸무는 남이 나를 원망한다는 옛 풀이와 달리, 내가 남을 원망하게 된다는 뜻으로 읽습니다.'),
            'ly-04-13':(
              '예는 왜 사람 사이의 다툼을 줄인다고 했을까요. 『논어금독』은 원하는 것을 구하는 과정에서 생기는 충돌을 짚고, 예의 형식에 양보하는 마음이 담겨 있다고 설명합니다.',
              '예는 왜 사람 사이의 다툼을 줄인다고 했을까요. 『논어금독』은 사람들이 원하는 것을 얻으려다 다투게 되는 까닭을 설명하고, 예에는 서로 양보하는 마음이 담겨 있다고 봅니다.'),
            'ly-05-27':(
              '작은 마을에도 성실한 사람은 있다는 말씀을 풀이한 주석입니다. 타고난 바탕이 좋은 것과 배워서 그 바탕을 가꾸는 것은 다르다며, 공자님이 호학을 강조하신 뜻을 설명합니다.',
              '작은 마을에도 타고난 성품이 좋은 사람은 있을 수 있습니다. 그러나 배우지 않으면 그 좋은 성품을 제대로 살리기 어렵다는 뜻으로, 공자님이 호학을 강조하신 까닭을 설명합니다.'),
            'ly-13-29':(
              '백성을 가르친다는 말이 군사를 쓰는 일과 어떻게 연결되는지 살핍니다. 그 근거로, 진나라 임금이 출병하려 할 때마다 자범이 의리와 믿음을 먼저 물었던 기록을 소개합니다.',
              '백성을 가르치지 않은 채 군사를 쓰면 왜 문제가 될까요? 진나라 임금이 출병하려 할 때마다 자범이 의리와 믿음을 먼저 물었던 기록이 그 이유를 보여 줍니다.'),
            'ly-15-29':(
              '큰물이 난 송나라에 노나라가 위문을 보냅니다. 송나라가 어떻게 답했는지, 그 답은 어떤 평가를 받았는지 전합니다. 이후 송나라가 힘쓴 일도 소개하며, 허물을 인정하고 고친 과정을 보여 줍니다.',
              '큰물이 난 송나라에 노나라가 위문을 보냅니다. 송나라가 어떻게 답했고 그 답이 어떤 평가를 받았는지 전합니다. 이후 송나라는 잘못을 인정하고 고치려 힘썼습니다.'),
            'ly-16-02':(
              '이 공자 전기는 예악과 정벌의 권한이 누구에게 있어야 하는지부터 설명합니다. 이어 천자·제후·대부·가신의 관계가 뒤집힌 과정을 통해 당시의 혼란을 보여 줍니다.',
              '이 공자 전기는 예악과 정벌의 권한이 누구에게 있어야 하는지부터 설명합니다. 이어 천자·제후·대부·가신의 위계가 무너진 당시 현실도 설명합니다.'),
            'ly-17-11':(
              '첸무는 예악에 쓰는 물건과 그 바탕을 구별합니다. 그 바탕을 공경과 화합의 마음으로 보는 풀이와, 백성과 풍속에 미치는 효과로 보는 풀이를 함께 살핍니다.',
              '첸무는 예악에 쓰는 물건과 그 바탕을 구별합니다. 한쪽은 공경과 화합의 마음을, 다른 쪽은 예악이 백성과 풍속을 어떻게 바꾸는지를 중요하게 봅니다.'),
            'ly-18-01':(
              '자공은 설야와 비간이 간언하다 죽은 일을 비교합니다. 『공자가어』에서는 임금과의 관계, 간언의 뜻과 효과를 따져 두 죽음을 다르게 평가합니다.',
              '자공은 설야와 비간이 간언하다 죽은 일을 비교합니다. 『공자가어』에서는 두 사람이 어떤 임금을 섬겼고 왜 간언했는지, 그 결과가 어땠는지를 따져 두 죽음을 다르게 평가합니다.'),
            'ly-19-06':(
              '널리 배우고 뜻을 굳게 지키며, 자세히 묻고 자신에게서부터 생각하라는 네 가지 말을 차례로 살펴봅니다. 정약용은 이 네 가지를 인륜을 실천하는 일과 연결해 설명하고, 자하의 다른 말과 함께 살핍니다.',
              '널리 배우고 뜻을 굳게 지키며, 자세히 묻고 자신에게서부터 생각하라는 네 가지 가르침이 나옵니다. 정약용은 이를 인륜을 실천하는 데 필요한 공부로 풀이하고, 자하의 다른 말도 함께 설명합니다.'),
            'ly-19-13':(
              '자하가 말한 벼슬과 배움의 관계를 첸무가 살핍니다. 일을 하며 배우는 것과 배운 뒤 일하는 것이 각각 어떤 도움을 주는지 살핍니다. ‘여력’이 무슨 뜻인지도 함께 풀이합니다.',
              '첸무는 일을 하면서 배우는 경우와 먼저 배운 뒤 일하는 경우를 나누어 자하의 말을 풀이합니다. 두 경우가 각각 어떤 도움이 되는지 말하고, ‘여력’이 무슨 뜻인지도 풀이합니다.')
          }
          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          if len(files)!=20: raise SystemExit(f'files={len(files)}')
          data_by_file={}; by_id={}; total=0
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8')); data_by_file[fn]=d
              for ch in d['장']:
                  total+=1; by_id[ch['구절ID']]=(fn,ch)
          if total!=498: raise SystemExit(f'chapters={total}')
          if set(edits)-set(by_id): raise SystemExit('missing ids')
          changed=set(); audit=[]
          for cid,(old,new) in edits.items():
              fn,ch=by_id[cid]
              if ch['여는말']!=old:
                  raise SystemExit(f'{cid} mismatch\nCURRENT={ch["여는말"]}\nEXPECTED={old}')
              ch['여는말']=new; changed.add(fn)
              audit.append({'구절ID':cid,'파일':fn,'수정전':old,'수정후':new,'승인상태':'승인완료','본문반영':True})
          for fn in changed:
              Path(fn).write_text(json.dumps(data_by_file[fn],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          base14=Path('sourcecards-targeted-review-7passes/cycle2-pass14-metaphor-abstract')
          (base14/'application-audit-10.json').write_text(json.dumps({'작업':'불필요한 비유·추상표현 10건','승인상태':'승인완료','본문반영수':10,'후보':audit},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=base14/'approval-table-10.md'
          if p.exists():
              t=p.read_text(encoding='utf-8').replace('**승인 대기 / 본문 JSON 미반영**','**승인완료 / 본문 JSON 10건 반영완료**',1)
              p.write_text(t,encoding='utf-8')

          # scan next type: document/meta-intro verbs where the opening talks about what a text/record/commentary does
          rows=[]
          patterns=['다룹니다','소개합니다','나옵니다','이어집니다','전합니다','실었습니다','모았습니다','덧붙입니다','보탭니다','설명합니다','풀이합니다','알려 줍니다','보여 줍니다','정리합니다']
          subjectish=['글','기록','주석','문답','논설','전기','자료','이야기','대목','책','『','《','여기','뒤에는','앞에는','마지막에는','이어']
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in d['장']:
                  text=ch['여는말']
                  sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
                  for i,s in enumerate(sents,1):
                      verbs=[v for v in patterns if v in s]
                      if not verbs: continue
                      # keep broad candidate set, then human-review downstream
                      rows.append({'구절ID':ch['구절ID'],'편장':ch['편장'],'파일':fn,'문장번호':i,'문장':s,'표지':verbs,'전체여는말':text})
          base15=Path('sourcecards-targeted-review-7passes/cycle2-pass15-meta-intro')
          base15.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          md=['# 사료카드 2단계 자료소개형 메타문장 전수 스캔','',f'- 기준 커밋: `{head}`','- 대상: 20파일 / 498장',f'- 표지 적중 문장: **{len(rows)}문장**','- 주의: 자동 수정 대상 아님. 실제 내용보다 `글/기록/주석이 무엇을 한다`는 안내가 앞서는 경우만 후속 수정 후보로 선별.','']
          for i,r in enumerate(rows,1):
              md.append(f"{i}. `{r['구절ID']}` | {r['편장']} | 표지={','.join(r['표지'])} | {r['문장']} | 전체: {r['전체여는말']}")
          (base15/'all-hits.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (base15/'all-hits.json').write_text(json.dumps({'기준커밋':head,'대상장수':498,'적중문장수':len(rows),'항목':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('applied',len(edits),'meta_hits',len(rows))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          fs=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          assert len(fs)==20
          assert sum(len(json.loads(Path(f).read_text(encoding='utf-8'))['장']) for f in fs)==498
          print('validated 20 JSON / 498 chapters')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/cycle2-pass14-metaphor-abstract/ sourcecards-targeted-review-7passes/cycle2-pass15-meta-intro/
          git commit -m '사료카드 2단계 비유·추상 10건 반영 및 메타문장 전수스캔'
          git push origin main
