name: TEMP Stage2 Juseok Remaining20 Snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-juseok-remaining20-snapshot.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build current 20 snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json,glob
          from pathlib import Path
          ids=['ly-05-01','ly-06-07','ly-06-21','ly-06-27','ly-07-08','ly-07-34','ly-07-37','ly-08-13','ly-09-12','ly-09-24','ly-11-15','ly-12-18','ly-12-21','ly-13-04','ly-13-26','ly-14-05','ly-14-10','ly-14-42','ly-15-34','ly-19-01']
          rows=[]
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  if ch['구절ID'] in ids:
                      rows.append((ch['구절ID'],ch['편장'],fn,ch['여는말']))
          if {r[0] for r in rows}!=set(ids): raise SystemExit('missing ids')
          order={x:i for i,x in enumerate(ids)}
          rows.sort(key=lambda r:order[r[0]])
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject')
          out=['# 잔여 수정권고 20건 현재 여는말','']
          for i,(cid,pj,fn,text) in enumerate(rows,1):
              out += [f'## {i}. {pj} `{cid}`',f'- 파일: `{fn}`',f'- 현재: {text}','']
          (base/'remaining-20-current-openings.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject/remaining-20-current-openings.md
          git commit -m '사료카드 2단계 잔여 주석 20건 현재본 스냅샷'
          git push origin main
