name: TEMP Apply Stage2 Pass4
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-stage2-pass4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved pass4 edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit_path = Path('sourcecards-targeted-review-7passes/pass4-redundancy/audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          candidates = audit['후보']
          if len(candidates) != 8:
              raise SystemExit(f'candidate count mismatch: {len(candidates)}')
          staged = {}
          for c in candidates:
              p = Path(c['파일'])
              text = staged.get(p, p.read_text(encoding='utf-8'))
              old = c['수정전']; new = c['수정후제안']
              if text.count(old) != 1:
                  raise SystemExit(f'{c["구절ID"]}: expected 1 match in {p}, got {text.count(old)}')
              text = text.replace(old, new, 1)
              json.loads(text)
              staged[p] = text
          for p,text in staged.items(): p.write_text(text, encoding='utf-8')
          for c in candidates:
              c['승인상태']='승인완료'; c['본문반영']=True
          audit['승인상태']='승인완료'; audit['본문반영수']=8; audit['반영완료']=True
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          changed=$(git diff --name-only -- sourcecards-style-polish/ | wc -l)
          test "$changed" -eq 7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/pass4-redundancy/audit.json
          git commit -m '사료카드 2단계 4바퀴 승인 8건 실제 반영'
          git push origin main
