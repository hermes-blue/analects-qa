name: TEMP Stage2 Question Openings Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-question-openings-candidates.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate candidates and build review files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass10-question-openings')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              p=ln.split('\t')
              if len(p)!=4: raise SystemExit(f'bad row: {ln!r}')
              spec.append(p)
          if len(spec)!=12: raise SystemExit(f'expected 12 got {len(spec)}')
          rows={}
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows[ch['구절ID']]=(fn,ch)
          if len(rows)!=498: raise SystemExit(len(rows))
          audits=[]
          md=['# 사료카드 2단계 상투적 질문형 도입 수정안 12건','',f'- 검토 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: 498장 전체 여는말','- 질문 포함 장수: 38장 / 첫 문장 질문: 36장','- 실제 본문 JSON 반영: **0건 (승인 대기)**','- 기준: 실제 독해 쟁점 질문은 유지하고, 답이 바로 이어지는 수사적·흥미 유도 질문만 직접 서술로 전환','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,old,new,reason in spec:
              if cid not in rows: raise SystemExit(f'missing {cid}')
              fn,ch=rows[cid]; text=ch['여는말']
              if text.count(old)!=1: raise SystemExit(f'{cid}: old match={text.count(old)}')
              revised=text.replace(old,new,1)
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':revised,'수정전구간':old,'수정후구간':new,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f'| {ch["편장"]} | {esc(old)} | {esc(new)} | {reason} |')
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          out={'작업':'사료카드 2단계 상투적 질문형 도입 전수검토','대상장수':498,'질문포함장수':38,'첫문장질문장수':36,'후보수':12,'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['498장 전체 기준 검토','질문형 자체를 금지하지 않음','독법·지시대상·글자뜻 등 실제 독해 쟁점 질문은 유지','답이 바로 이어지는 수사적 질문만 직접 서술로 전환','정보·해석·조건·부정·추정 강도 유지'],'후보':audits}
          (base/'audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme='''# 상투적 질문형 도입 전수검토\n\n- 대상: 사료카드 2단계 여는말 498장 전체\n- 질문 포함 장수: 38장\n- 첫 문장이 질문인 장수: 36장\n- 최종 후보: 12장\n- 본문 반영: 0건 (승인 대기)\n\n질문형 도입 자체는 전체의 약 7% 수준이라 남발로 보기는 어렵습니다. 다만 답이 바로 뒤에 붙어 있는 수사적 질문은 카드 문체를 반복적으로 보이게 할 수 있어 직접 서술로 바꾸는 후보로 잡았습니다. 반대로 누가 누구를 가리키는지, 한 글자를 어떻게 읽는지처럼 실제 독해 쟁점을 여는 질문은 유지했습니다.\n'''
          (base/'README.md').write_text(readme,encoding='utf-8')
          PY
      - name: Commit review files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass10-question-openings/approval-table.md sourcecards-targeted-review-7passes/cycle2-pass10-question-openings/audit.json sourcecards-targeted-review-7passes/cycle2-pass10-question-openings/README.md
          git commit -m '사료카드 2단계 질문형 도입 12건 수정안 정리'
          git push origin main
