name: TEMP Apply Stage2 Pass7
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-stage2-pass7.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved pass7 edits
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit_path=Path('sourcecards-targeted-review-7passes/pass7-translationese-passive/audit.json')
          audit=json.loads(audit_path.read_text(encoding='utf-8'))
          candidates=audit['후보']
          if len(candidates)!=7:
              raise SystemExit(f'candidate count mismatch: {len(candidates)}')
          staged={}
          for c in candidates:
              p=Path(c['파일'])
              text=staged.get(p,p.read_text(encoding='utf-8'))
              old=c['수정전']; new=c['수정후제안']
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{c["구절ID"]}: expected 1 match in {p}, got {count}')
              text=text.replace(old,new,1)
              json.loads(text)
              staged[p]=text
          for p,text in staged.items():
              p.write_text(text,encoding='utf-8')
          for c in candidates:
              c['승인상태']='승인완료'; c['본문반영']=True
          audit['승인상태']='승인완료'; audit['본문반영수']=7; audit['반영완료']=True
          audit_path.write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'validated and applied 7 edits across {len(staged)} JSON files')
          PY
      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          files=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          if len(files)!=20:
              raise SystemExit(f'expected 20 JSON files, got {len(files)}')
          total=0
          for fn in files:
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              total += len(data['장'])
          if total != 498:
              raise SystemExit(f'expected 498 chapters, got {total}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/pass7-translationese-passive/audit.json
          git commit -m '사료카드 2단계 7바퀴 승인 7건 실제 반영'
          git push origin main
