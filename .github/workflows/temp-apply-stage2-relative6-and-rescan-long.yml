name: TEMP Apply Stage2 Relative6 And Rescan Long
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-relative6-and-rescan-long.yml']
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved six and rescan long adnominal sentences
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,re,subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass16-relative-clause-density')
          p=base/'approval-table-6.md'
          rows=[]
          for ln in p.read_text(encoding='utf-8').splitlines():
              if not ln.startswith('| ') or ln.startswith('|---') or ln.startswith('| 편·장'):
                  continue
              parts=[x.strip() for x in ln.split('|')[1:-1]]
              if len(parts)==4: rows.append(parts)
          if len(rows)!=6: raise SystemExit(f'proposal rows={len(rows)}')
          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          if len(files)!=20: raise SystemExit(f'files={len(files)}')
          data_by_file={}; by_pj={}; total=0
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8')); data_by_file[fn]=d
              for ch in d['장']:
                  total+=1; by_pj[ch['편장']]=(fn,ch)
          if total!=498: raise SystemExit(f'chapters={total}')
          changed=set(); audit=[]
          for pj,old,new,reason in rows:
              if pj not in by_pj: raise SystemExit(f'missing {pj}')
              fn,ch=by_pj[pj]
              if ch['여는말']!=old:
                  raise SystemExit(f'{pj} mismatch\nCURRENT={ch["여는말"]}\nOLD={old}')
              ch['여는말']=new; changed.add(fn)
              audit.append({'편장':pj,'파일':fn,'수정전':old,'수정후':new,'승인상태':'승인완료','본문반영':True})
          for fn in changed:
              Path(fn).write_text(json.dumps(data_by_file[fn],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          t=p.read_text(encoding='utf-8').replace('**승인 대기 / 본문 JSON 미반영**','**승인완료 / 본문 JSON 6건 반영완료**',1)
          p.write_text(t,encoding='utf-8')
          (base/'application-audit-6.json').write_text(json.dumps({'작업':'관형절 중첩·명사구 과밀 6건','승인상태':'승인완료','본문반영수':6,'후보':audit},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Second pass: deliberately broader long-sentence scan, independent of prior score.
          markers=['하는','한 ','했던','하던','되는','된 ','라는','이라는','이라고','하려는','해야 하는','할 수 있는','해야 할','하게 하는','하도록','는지','ㄴ지','을지','라는 점','다는 점','것을','것이','것으로']
          hits=[]
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in d['장']:
                  text=ch['여는말']
                  sents=[s.strip() for s in re.split(r'(?<=[.!?])\s+',text) if s.strip()]
                  for i,s in enumerate(sents,1):
                      if len(s)<60: continue
                      found=[m for m in markers if m in s]
                      # capture all >=75; or >=60 with at least one adnominal/embedded clause + comma/conjunction density
                      comma=s.count(',')+s.count('，')
                      connect=sum(s.count(x) for x in ['고,','며,','면서','지만','는데','뒤,','후,','하며','하고','거나','거나,'])
                      if len(s)>=75 or (found and (comma>=1 or connect>=2)):
                          hits.append({'구절ID':ch['구절ID'],'편장':ch['편장'],'파일':fn,'문장번호':i,'문장':s,'전체여는말':text,'길이':len(s),'표지':found,'쉼표수':comma,'연결점수':connect})
          hits.sort(key=lambda r:(-r['길이'],-len(r['표지']),-r['쉼표수']))
          outbase=Path('sourcecards-targeted-review-7passes/cycle2-pass17-long-relative-clauses')
          outbase.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          md=['# 지나치게 긴 관형절·인용절 문장 2차 전수스캔','',f'- 기준 커밋: `{head}`','- 대상: 20파일 / 498장',f'- 장문 후보: **{len(hits)}문장**','- 1차 점수식과 별도로, 60자 이상 장문을 더 넓게 포착. 자동 수정 대상 아님.','']
          for i,r in enumerate(hits,1):
              md.append(f"{i}. `{r['구절ID']}` | {r['편장']} | 길이={r['길이']} | 표지={','.join(r['표지']) or '-'} | {r['문장']} | 전체: {r['전체여는말']}")
          (outbase/'broad-hits.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (outbase/'broad-hits.json').write_text(json.dumps({'기준커밋':head,'대상장수':498,'장문후보수':len(hits),'항목':hits},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # split chunks of 25 for manual review
          for n,a in enumerate(range(0,len(hits),25),1):
              part=hits[a:a+25]
              cm=[f'# 장문 관형절 후보 {a+1}~{a+len(part)}','']
              for j,r in enumerate(part,a+1): cm.append(f"{j}. {r['구절ID']} | {r['편장']} | 길이={r['길이']} | 문장: {r['문장']} | 전체: {r['전체여는말']}")
              (outbase/f'review-chunk-{n}.md').write_text('\n'.join(cm)+'\n',encoding='utf-8')
          print('applied',len(rows),'broad_hits',len(hits))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          fs=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          assert len(fs)==20
          assert sum(len(json.loads(Path(f).read_text(encoding='utf-8'))['장']) for f in fs)==498
          print('validated 20 JSON / 498 chapters')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/cycle2-pass16-relative-clause-density/ sourcecards-targeted-review-7passes/cycle2-pass17-long-relative-clauses/
          git commit -m '사료카드 2단계 관형절 6건 반영 및 장문 관형절 재스캔'
          git push origin main
