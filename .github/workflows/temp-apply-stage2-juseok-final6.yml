name: TEMP Apply Stage2 Final Juseok 6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-apply-stage2-juseok-final6.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply approved six openings
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          from pathlib import Path
          edits={
            'ly-08-10':(
              '주석들은 가난을 원망하는 사람과 어질지 못한 이를 몰아세우는 사람을 함께 논하며, 두 태도가 서로 다른데도 왜 모두 난을 일으킬 수 있는지 설명합니다.',
              '가난을 원망하는 사람과 어질지 못한 이를 몰아세우는 사람은 서로 달라 보입니다. 하지만 두 태도 모두 사람들의 불만을 키워 난으로 이어질 수 있다고 설명합니다.'),
            'ly-08-14':(
              '이 주석은 자기 직분을 넘지 말라는 공자님과 증자의 말을 함께 풀이합니다. 남의 관직을 침범하지 말라는 뜻을 설명하고, 두 발언을 한 장으로 묶은 이유도 살핍니다.',
              '공자님과 증자는 모두 자기 직분을 넘어 남의 일에 간섭하지 말라고 말합니다. 두 말씀은 남의 관직을 침범하지 말라는 같은 뜻으로 이어집니다.'),
            'ly-10-11':(
              '옛사람들은 문안할 때 안부를 묻는 데 그치지 않고 선물을 보내거나 절도 했습니다. 주석은 사신을 보내며 두 번 절한 행동이 누구를 향한 예였는지 풀어 줍니다.',
              '옛사람들은 문안할 때 안부를 묻는 데 그치지 않고 선물을 보내거나 절도 했습니다. 사신을 보내며 두 번 절한 것은 사신에게 한 예가 아니라, 선물을 보낸 사람에게 예를 표한 행동으로 풀이됩니다.'),
            'ly-16-07':(
              '범씨는 나이에 따라 변하는 혈기와, 뜻을 세우고 지키는 기운을 구별합니다. 후자는 길러야 할 기운이라고 봅니다. 이 주석은 두 기운의 관계를 바탕으로 색욕·다툼·탐욕을 경계하라는 가르침을 풀이합니다.',
              '범씨는 나이에 따라 달라지는 혈기와 뜻을 세워 지키는 기운을 구별합니다. 후자는 길러야 할 기운이며, 이런 차이에서 색욕·다툼·탐욕을 경계해야 할 까닭도 설명합니다.'),
            'ly-17-17':(
              '이 주석은 공자님이 여러 곳에서 사람들의 마음을 움직이셨다는 이야기로 시작합니다. 이를 바탕으로 남에게 인정받으려다 말과 낯빛을 꾸미게 될 수 있다고 설명합니다.',
              '공자님이 여러 곳에서 사람들의 마음을 움직이셨다는 이야기가 먼저 나옵니다. 그러나 남에게 인정받으려는 마음이 앞서면 말과 낯빛을 꾸미게 될 수 있다고 경계합니다.'),
            'ly-19-04':(
              '이 주석은 여러 학파와 기예를 귀·눈·입·코에 견줍니다. 각각의 장점을 인정하면서도 한 가지에 머물 때의 한계를 짚고, 사람을 다스리기 위한 폭넓은 배움은 이와 다르다고 설명합니다.',
              '여러 학파와 기예를 귀·눈·입·코에 견주는 비유가 나옵니다. 각각 쓰임은 있지만 한 가지에만 머물면 한계가 있으며, 사람을 다스리려면 더 넓게 배워야 한다고 설명합니다.')
          }
          files=sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json'))
          if len(files)!=20: raise SystemExit(f'files={len(files)}')
          total=0; found={}; filedata={}
          for fn in files:
              d=json.loads(Path(fn).read_text(encoding='utf-8')); filedata[fn]=d
              for ch in d['장']:
                  total+=1
                  if ch['구절ID'] in edits:
                      found[ch['구절ID']]=(fn,ch)
          if total!=498: raise SystemExit(f'chapters={total}')
          if set(found)!=set(edits): raise SystemExit(f'missing={set(edits)-set(found)}')
          changed=set()
          for cid,(old,new) in edits.items():
              fn,ch=found[cid]
              if ch['여는말']!=old:
                  raise SystemExit(f'{cid} mismatch\nCURRENT={ch["여는말"]}\nEXPECTED={old}')
              ch['여는말']=new; changed.add(fn)
          for fn in changed:
              Path(fn).write_text(json.dumps(filedata[fn],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Audit
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject')
          audit={'작업':'사료카드 2단계 잔여 주석 문장 최종 6건','승인상태':'승인완료','본문반영수':6,'반영완료':True,
                 '후보':[{'구절ID':cid,'파일':found[cid][0],'수정전':old,'수정후':new,'본문반영':True} for cid,(old,new) in edits.items()]}
          (base/'remaining-final6-application-audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('applied',len(edits),'files',len(changed),'chapters',total)
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import json,glob
          from pathlib import Path
          fs=glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')
          assert len(fs)==20
          assert sum(len(json.loads(Path(f).read_text(encoding='utf-8'))['장']) for f in fs)==498
          print('validated 20 JSON / 498 chapters')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-style-polish/ sourcecards-targeted-review-7passes/cycle2-pass13-juseok-subject/remaining-final6-application-audit.json
          git commit -m '사료카드 2단계 잔여 주석 문장 최종 6건 실제 반영'
          git push origin main
