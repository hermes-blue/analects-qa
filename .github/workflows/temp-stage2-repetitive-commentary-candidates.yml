name: TEMP Stage2 Repetitive Commentary Candidates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-stage2-repetitive-commentary-candidates.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate candidate spec and build review files
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          base=Path('sourcecards-targeted-review-7passes/cycle2-pass8-repetitive-commentary')
          spec=[]
          for ln in (base/'candidate-spec.tsv').read_text(encoding='utf-8').splitlines():
              if not ln.strip(): continue
              p=ln.split('\t')
              if len(p)!=4: raise SystemExit(f'bad row: {ln!r}')
              spec.append(p)
          if len(spec)!=38: raise SystemExit(f'expected 38, got {len(spec)}')
          rows={}
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  rows[ch['구절ID']]=(fn,ch)
          if len(rows)!=498: raise SystemExit(f'expected 498, got {len(rows)}')
          audits=[]; md=['# 사료카드 2단계 반복 해설·상투 마무리 수정안 38건','',f'- 검토 기준 커밋: `{subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}`','- 대상: `sourcecards-style-polish/` 498장 전체 여는말','- 실제 본문 JSON 반영: **0건 (승인 대기)**','- 기준: 앞 문장을 다시 이름 붙이거나 `~한 주석/대목/기록/이야기입니다`로 상투적으로 닫는 경우 중, 직접 서술로 바꾸면 정보 손실 없이 더 자연스러운 곳만 선별','', '| 편·장 | 수정 전 | 수정 후 제안 | 이유 |','|---|---|---|---|']
          def esc(s): return s.replace('|','\\|').replace('\n',' ')
          for cid,old,new,reason in spec:
              if cid not in rows: raise SystemExit(f'missing id {cid}')
              fn,ch=rows[cid]; text=ch['여는말']
              n=text.count(old)
              if n!=1: raise SystemExit(f'{cid}: expected 1 exact match, got {n}')
              revised=text.replace(old,new,1)
              audits.append({'구절ID':cid,'편장':ch['편장'],'파일':fn,'수정전전체':text,'수정후전체':revised,'수정전구간':old,'수정후구간':new,'이유':reason,'승인상태':'승인대기','본문반영':False})
              md.append(f"| {ch['편장']} | {esc(old)} | {esc(new)} | {reason} |")
          out={'작업':'사료카드 2단계 반복 해설·상투 마무리 전수검토','대상장수':498,'후보수':len(audits),'검토완료':True,'승인상태':'승인대기','본문반영수':0,'검토원칙':['498장 전체 정독','표지어 빈도만으로 수정하지 않음','앞 문장과 기능이 겹치는 메타 해설·자료 라벨을 직접 서술로 전환','정보·해석·조건·부정·추정 강도 유지','이전 사용자 보류 후보는 재상정하지 않음'],'후보':audits}
          (base/'approval-table.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          (base/'audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          readme='''# 반복 해설·상투 마무리 전수검토\n\n- 대상: 사료카드 2단계 `sourcecards-style-polish/` 498장 전체\n- 전수 정독 완료\n- 보조 스캔 적중: 340장\n- 최종 후보: 38장\n- 본문 반영: 0건 (승인 대기)\n\n주된 문제는 `~한 주석입니다`, `~한 대목입니다`, `~한 기록입니다`, `~한 이야기입니다`처럼 자료에 이름표를 붙인 뒤 다음 문장에서 다시 같은 내용을 설명하는 구조였습니다. 이런 표현 자체를 금지하지 않고, 직접 서술로 바꾸면 정보 손실 없이 문장이 덜 겹치는 곳만 후보화했습니다.\n'''
          (base/'README.md').write_text(readme,encoding='utf-8')
          print('validated',len(audits),'candidates')
          PY
      - name: Commit review files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/cycle2-pass8-repetitive-commentary/approval-table.md sourcecards-targeted-review-7passes/cycle2-pass8-repetitive-commentary/audit.json sourcecards-targeted-review-7passes/cycle2-pass8-repetitive-commentary/README.md
          git commit -m '사료카드 2단계 반복 해설·상투 마무리 38건 수정안 정리'
          git push origin main
