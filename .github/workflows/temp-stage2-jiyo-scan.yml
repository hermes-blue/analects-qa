name: TEMP Stage2 Jiyo Scan
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-stage2-jiyo-scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Scan 498 openings for 지요/죠
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, subprocess
          from pathlib import Path
          rows=[]
          total=0
          for fn in sorted(glob.glob('sourcecards-style-polish/[0-9][0-9]-*.json')):
              data=json.loads(Path(fn).read_text(encoding='utf-8'))
              for ch in data['장']:
                  total += 1
                  text=ch['여는말']
                  if '지요' in text or '죠' in text:
                      rows.append({'구절ID': ch['구절ID'], '편장': ch['편장'], '파일': fn, '여는말': text})
          if total != 498:
              raise SystemExit(f'expected 498 openings, got {total}')
          out=Path('sourcecards-targeted-review-7passes/jiyo-ending-scan-20260908.json')
          report={
              '작업':'사료카드 2단계 여는말 지요체 전수검색',
              '기준커밋':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              '대상장수':total,
              '검색어':['지요','죠'],
              '발견수':len(rows),
              '발견항목':rows,
              '상태':'수정필요' if rows else '잔존없음'
          }
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Commit scan report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sourcecards-targeted-review-7passes/jiyo-ending-scan-20260908.json
          git commit -m '사료카드 2단계 지요체 498장 전수검색 기록'
          git push origin main
